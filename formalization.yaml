    id: ISBN 978-0-8218-4974-3
    type: book
    location: >-
      Graduate Studies in Mathematics 19, American Mathematical Society, Providence, RI, 2010; https://www.ams.org/bookpages/gsm-19-r
    relationship: formalizes
    note: >-
      Principal reference. We contacted Evans about following his book, and he was excited about the
      project. The Blueprint records the hypotheses and conclusions of each
      cited formal statement. Selected results are formalized. In Chapter 12, energy is conserved for
      waves with separately compact spatial slices: for a normalized C2 potential and a C2 wave in every
      positive dimension, and for a normalized C1 potential for C3 waves in one dimension, C4 waves in
      two dimensions, and C2 waves in every positive dimension under a quadratic lower bound near zero.
      At a finite maximal lifespan the displacement is unbounded on every terminal strip.
