status:
  scope: >-
    Selected classical, weak, distributional, and variational results for elliptic, parabolic, and hyperbolic
    PDEs; analytic Cauchy problems; Sobolev calculus, extension, traces, embeddings, and compactness;
    fluid formulations and exact constructions; and verified symbolic and numerical computation. Each declaration
    and Blueprint card states its hypotheses; the module docs record the precise coverage. The Clay Navier–Stokes alternatives are definitions, not resolved results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
    - >-
      _native.cegaFast.ax_* (generated native closed finite certificate and polynomial interval checks,
      only in the fast build profile)
automation:
  methods:
    - method: manual
      models: []
      framework: n/a
      tool_setup: VS Code with the Lean 4 extension, Lake, and the Blueprint build script
      cost:
        wall_time: not tracked
        spend_usd: n/a
        hardware: developer workstations and a cloud Linux build server
      prompting_notes: n/a
    - method: agent
      models:
        - not tracked in full; commercial language models used through terminal coding agents
      framework: terminal coding agents driven by the authors
      tool_setup: >-
        Agents wrote and repaired proofs and documentation under author-chosen specifications, using the
        pinned Lean environment and the repository conventions. Lake compiles the library under strict
        Lake options.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: API-backed agents on a cloud Linux build server
      prompting_notes: >-
        The authors supplied mathematical statements, the pinned Lean and Mathlib APIs, and the repository
        conventions. Agents assisted with proof search, repair, API discovery, and documentation. Selected
        finite certificates use the shared cega [fast] frontend.
        The default kernel build profile checks them in the kernel; the fast profile evaluates them natively,
        which additionally trusts Lean’s compiler and runtime.
  spend_usd: not tracked
  notes: >-
    We used AI coding agents to write and repair proofs and documentation. We chose the statements,
    definitions and sources, and checked the claims.
fidelity:
  divergences: >-
    Differential operators are total Lean terms built on Mathlib's fderiv and are read classically only
    under stated differentiability; the heat kernel is zero-extended to t <= 0 and its equation is stated
    for t > 0 only; sphere and ball averages use the center value at radius zero and zero at negative
    radius; the half-space uses the last coordinate as the normal direction and a coordinate parametrization
    of its boundary; d'Alembert's formula is formalized at unit speed with Evans's C^2 and C^1 data hypotheses;
    the one-dimensional Morrey and critical Sobolev inequalities are proved for C^1 and smooth compactly
    supported functions (the representative and operator forms are separate declarations). Boundary geometry
    is expressed through local graph predicates and operational atlases. Applying an atlas-based theorem
    to graph data requires the corresponding proved graph-to-atlas construction at the stated regularity.
    The CAS soundness theorems are SymLean and PDEAtlas results without an external source. Statement-level qualifications
    of every Blueprint card are recorded on the card.
review:
  status: self-assessed
  reviewers:
    - Robert Joseph George
    - Peicong Song
  notes: >-
    Lake builds with automatic implicit arguments disabled, Mathlib’s standard linters, and warnings as
    errors. The default lake build checks every proof in the kernel, the finite certificates included,
    and that build is up to date at this release. The fast profile uses compiled evaluation for the
    certificates, and downstream theorems then inherit that dependency. No independent Comparator check
    is claimed.
alignment:
  namespace: PDE (with the equation-family namespaces HeatEquation, WaveEquation, LaplacianEquation, GreenFunction,
    SobolevSpace)
  statements:
    - source: Evans, Section 8.1.2 (fundamental lemma used in the Euler-Lagrange derivation)
      lean: IsOpen.ae_eq_zero_of_integral_contDiff_smul_eq_zero
      module: Mathlib.Analysis.Distribution.AEEqOfIntegralContDiff
      status: proved
      note: >-
        Reused directly from Mathlib: locally integrable functions paired against smooth compactly supported
        tests, with almost-everywhere vanishing on an open set.
    - source: Evans, Section 2.3.1 (fundamental solution of the heat equation)
      lean: HeatEquation.fundamentalSolutionHeat_deriv_t
      module: PDE.Parabolic.Heat.Kernel.TimeDerivative
      status: proved
      note: Closed form of the time derivative for t > 0 for the library's heat kernel.
    - source: Evans, Section 2.3.1 (the fundamental solution solves the heat equation)
      lean: HeatEquation.fundamentalSolutionHeat_satisfies_equation
      module: PDE.Parabolic.Heat.Kernel.Equation
      status: proved
      note: >-
        The spacetime time derivative minus the spatial Laplacian vanishes for t > 0, with the library's
        total partialDeriv and laplacian.
    - source: Evans, Section 2.4.1, Theorem 1 (solution of the wave equation, n = 1)
      lean: WaveEquation.waveOperator_dAlembertFormula
      module: PDE.Hyperbolic.Models.Wave.DAlembert.ClassicalSolution
      status: proved
      note: >-
        The wave residual of d'Alembert's field vanishes for g in C^2 and h in C^1. The initial identities
        are separate library theorems.
    - source: Evans, Chapter 4 (Fourier construction of wave solutions; Schwartz-data formulation)
      lean: WaveEquation.Fourier.realSolution_satisfiesResidualAssignedCauchyData
      module: PDE.Hyperbolic.Models.Wave.Fourier.Schwartz.Cauchy
      status: proved
      note: >-
        Real Schwartz displacement and velocity give a homogeneous wave solution in every finite dimension,
        including zero. Companion theorems prove joint C^2 regularity and joint initial traces of the
        field and its actual time derivative.
    - source: PDEAtlas (global classical real-line nonlinear wave Cauchy construction)
      lean: WaveEquation.exists_global_classical_solution_of_bounded_data
      module: PDE.Hyperbolic.NonlinearWave.RealLine.Cauchy
      status: proved
      note: >-
        A C^1 globally Lipschitz reaction and bounded C^2/C^1 displacement/velocity give a global forward
        classical solution, both Cauchy traces, and boundedness on each finite strip. No bounds on data
        derivatives or vanishing reaction at zero are required.
    - source: Evans, Section 2.4 (domain of dependence for the one-dimensional wave equation)
      lean: WaveEquation.dAlembertFormula_eq_of_eqOn_domainOfDependence
      module: PDE.Hyperbolic.Models.Wave.DAlembert.Formula
      status: proved
      note: No regularity is needed for this equality-on-the-domain-of-dependence statement.
    - source: Evans, Section 2.2.2, Theorem 2 (mean-value formulas for harmonic functions)
      lean: LaplacianEquation.IsHarmonicPDE.hasSphereMeanValueProperty
      module: PDE.Elliptic.Classical.MeanValue.PDEToMeanValue
      status: proved
      note: >-
        The spherical mean-value property for C^2 functions with vanishing coordinate Laplacian, in positive
        dimension. The ball-average form is a separate library theorem.
    - source: Evans, Section 2.2.4 (Poisson's formula for the half-space)
      lean: GreenFunction.poissonHalfSpaceExtension_one_eq_one
      module: PDE.Elliptic.PotentialTheory.GreenFunction.HalfSpace.PoissonKernel.Normalization
      status: proved
      note: The Poisson extension of the constant boundary datum 1 equals 1 on the upper half-space, in
        every positive dimension.
    - source: Evans, Section 5.6.2, Theorems 4 and 5 (Morrey's inequality), n = 1
      lean: SobolevSpace.holderWith_morreyExponent_one
      module: PDE.Spaces.Sobolev.Inequalities.Morrey.FiniteExponent.OneDimensional.Estimate
      status: adapted
      note: >-
        The Hölder-continuity form for a C^1 function on the line whose derivative has finite L^p seminorm,
        1 < p <= infinity. The multidimensional and W^{1,p} representative versions are separate library
        theorems.
    - source: Brezis, Chapter 8 (Sobolev spaces in one dimension), the embedding of W^{1,1} into L^infinity
      lean: SobolevSpace.CriticalOneDimensional.norm_apply_le_eLpNorm_partialDeriv_one_toReal
      module: PDE.Spaces.Sobolev.Inequalities.Morrey.Endpoint.OneDimensionalCritical
      status: adapted
      note: >-
        The smooth compactly supported core estimate. The bounded continuous representative and the operator
        W^{1,1} -> C_b are separate library declarations.
    - source: Evans, Chapter 4 (Laplace's method; multidimensional compact formulation)
      lean: PDE.Analysis.Asymptotics.tendsto_normalized_laplace_integral_compact
      module: PDE.Analysis.Asymptotics.LaplaceMethod.Euclidean
      status: proved
      note: >-
        A continuous phase on a compact set, C^2 near its unique interior minimum, with positive definite
        actual Hessian H gives the normalized t-to-infinity limit (2*pi)^(n/2)/sqrt(det H) times the continuous
        Banach-valued amplitude at the minimum. Dimension zero is included; stationarity and coercive
        bounds are derived.
    - source: Evans, Section 4.5.1 (boundary layers; variable-coefficient scalar extension)
      lean: PDE.Elliptic.BoundaryLayer.Variable.exists_expansion
      module: PDE.Elliptic.OneDimensional.BoundaryLayer.Variable.Expansion
      status: proved
      note: >-
        C^1 drift and forcing near [0,L], with L > 0 and drift bounded below by a positive constant, produce
        classical Dirichlet solutions of epsilon*u'' + a*u' = f. The family has uniform O(epsilon) composite
        error, inner convergence, and matching.
    - source: Evans, Section 4.5.3, Example 3 (geometric optics)
      lean: WaveEquation.GeometricOptics.squared_eikonal_of_wavePacket_family
      module: PDE.Hyperbolic.GeometricOptics.Limit
      status: proved
      note: >-
        Eventually C^2 exact complex wave packets imply the squared eikonal equation when amplitudes tend
        to a nonzero value, first phase derivatives converge to those of the limiting phase, and the epsilon^2-scaled
        amplitude wave residual tends to zero at the chosen point.
    - source: Evans, Section 4.4.3 (local Legendre transformation)
      lean: PDE.Analysis.exists_localLegendre_inverse_hessian
      module: PDE.Analysis.Calculus.Legendre.Local
      status: proved
      note: >-
        A C^2 function with nonsingular actual Hessian at one point has a constructed local inverse gradient
        and C^2 dual with inverse Hessian, in every finite dimension. Convexity is not assumed.
    - source: Evans, Section 4.4.3(a) (hodograph transformation)
      lean: PDE.Fluid.Hodograph.exists_hodograph_potential
      module: PDE.Fluid.Compressible.Hodograph
      status: proved
      note: >-
        A C^1 planar mass-and-curl solution with nonzero velocity Jacobian at one point gives a local
        inverse and a C^2 potential solving the scalar linear hodograph equation.
    - source: Evans, second edition (2010), Section 4.4.3(b), p. 210, equations (24)-(30) (minimal surface)
      lean: PDE.Elliptic.MinimalSurface.exists_localLegendre_solution_of_divergence_eq_zero
      module: PDE.Elliptic.MinimalSurface.Legendre
      status: proved
      note: >-
        A C^2 planar solution of the divergence minimal-surface equation with nonsingular Hessian at one
        point has a local C^2 Legendre dual solving the linear equation with principal matrix I + p*p^T.
        This is a local classical transformation.
