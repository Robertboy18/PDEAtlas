  - title: Nonuniqueness of Leray-Hopf solutions to the unforced incompressible 3D Navier-Stokes Equation
    authors:
      - Thomas Hou
      - Yixuan Wang
      - Changhe Yang
    id: https://arxiv.org/abs/2509.25116v2
    type: article
    relationship: adapts
    note: >-
      The library adapts the residual-correction argument of Sections 3.1-3.2 to validated quadratic
      Dirichlet problems, with explicit interval and cube examples. It constructs the compensated
      principal variational form on bounded domains and proves its coercivity and unique linear solve
      under a supplied compensation inequality. Solenoidal transport coefficients can have nonzero
      boundary values, and a compact L4 fixed-point argument constructs bounded-domain corrections
      with separate L2 and gradient radii under explicit residual and nonlinear budgets.
      PDEAtlas constructs distinct suitable Leray-Hopf solutions from any unstable profile
      (NavierStokes.Nonuniqueness.of_unstableProfile). The certificates for the paper's numerical
      profile and unstable eigenpair, and with them the nonuniqueness theorem
      NavierStokes.nonuniqueness, are formalized in the companion repository BlowupZoo
      (https://github.com/Robertboy18/BlowupZoo), at its level 8.
