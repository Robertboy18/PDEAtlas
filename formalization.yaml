      lean: CAS.Verified.Expr.hasFDerivAt_eval
      module: CAS.Calculus.Euclidean
      status: proved
      note: The formal Fréchet derivative of a valid expression is the Fréchet derivative of its evaluation.
    - source: SymLean (soundness of rational interval multiplication; no external source)
      lean: CAS.Continuum.RationalInterval.mul_sound
      module: CAS.Continuum.Interval.Rational.Arithmetic
