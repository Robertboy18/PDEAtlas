# PDEAtlas release metadata; version denotes the project release, not an external schema.
version: 1.0.0
project:
  name: PDEAtlas
  description: >-
    PDEAtlas is a substantial formalization and exposition of Lawrence C. Evans’s Partial
    Differential Equations, second edition, in Lean 4 and Mathlib. It develops classical,
    weak, distributional, and variational PDE theory: fundamental solutions and representation
    formulas; distributions and Fourier analysis; Sobolev calculus, approximation, extension,
    traces, embeddings, and compactness; elliptic existence, maximum principles, spectra,
    and regularity; heat and wave evolution; analytic Cauchy problems; Hamilton–Jacobi
    equations and conservation laws; and the calculus of variations. The accompanying
    Blueprint gives mathematical explanations, worked examples, and diagrams for graduate
    students and undergraduates with a background in analysis. The library is intended as
    reusable infrastructure for further work on Navier–Stokes, Euler, and singularity formation.
    Its proof-producing computer algebra system, SymLean, is implemented in Lean and connects symbolic
    normalization, differentiation, gradients, Laplacians, and supported integration to
    Mathlib’s real functions and analytic operators. CEGA adds certified interval and Taylor
    bounds, validated quadrature, matrix and root certificates, and ODE trajectory certificates,
    using FloatLib’s numerical backends. Accepted calculations produce proofs of their stated
    mathematical guarantees, with domain and regularity conditions preserved. The fluid
    development includes Stokes minimizers, Euler potential-flow constructions, vorticity,
    energy identities, exact flows, half-plane Biot–Savart estimates, axisymmetric Euler in a
    cylinder, and well-posedness of the half-plane Boussinesq system. The De Gregorio blowup of Chen, Hou, and Huang and the
    Navier–Stokes nonuniqueness of Hou, Wang, and Yang are formalized on top of PDEAtlas in the
    companion repository BlowupZoo (https://github.com/Robertboy18/BlowupZoo). The theorem statements and
    module docs record the precise coverage.
  authors:
    - Robert Joseph George
    - Anima Anandkumar
  contributors:
    - name: PDE group of Thomas Y. Hou, Caltech
      role: collaborator
    - name: Peicong Song
      role: contributor
  license: Apache-2.0
  responsible_maintainers:
    - Robert Joseph George
